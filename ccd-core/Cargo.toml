[package]
name = "ccd-core"
version = "0.1.0"
edition = "2021"

[dependencies]
portable-pty = "0.9.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.23.0", features = ["v4"] }
once_cell = "1.21.4"
dirs = "5"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
